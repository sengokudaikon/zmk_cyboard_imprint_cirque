# Bluetooth Configuration for macOS compatibility
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Device name
CONFIG_ZMK_KEYBOARD_NAME="Imprint"

# Split keyboard BLE configuration
CONFIG_ZMK_SPLIT_BLE=y

# Increase BLE stability
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1024
CONFIG_ZMK_BLE_THREAD_PRIORITY=5

# RGB Underglow (if needed)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y