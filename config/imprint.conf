# RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Bluetooth Configuration
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Fix for macOS BT connectivity issues
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# Increase BT transmit power for better connectivity
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# Device name (will appear as "Imprint" when pairing)
CONFIG_ZMK_KEYBOARD_NAME="Imprint"

# Enable split keyboard support
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Optional: Increase BLE queue sizes for better stability
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1024
CONFIG_ZMK_BLE_THREAD_PRIORITY=5

# Enable USB logging for debugging
CONFIG_ZMK_USB_LOGGING=y

# Enable ZMK Studio for visual configuration
CONFIG_ZMK_STUDIO=y